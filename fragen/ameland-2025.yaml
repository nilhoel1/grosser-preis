# Ameland 2025: Bilder und Musik sind NICHT im Repository, sondern nur im Quiz-Paket
# (der-grosse-preis-ameland-2025.zip). Ohne Paket fehlen die Bauwerke-Bilder, das
# Gitarren- und Kegelbild sowie die Lieder zu Musik 40 und 90.
# Fragen für "Der große Preis"
# Erstellt mit dem Fragen-Editor. Kann im Editor wieder geöffnet oder als Text bearbeitet werden.
# typ: risiko = Gruppe setzt Punkte (richtig: verdoppelt, falsch: abgezogen)
# typ: joker  = keine Frage, die Punkte gibt es geschenkt
# bild / antwort_bild / audio: Datei im Quiz-Paket, Pfad im Repository oder Internetadresse
titel: Der große Preis – Ameland 2025

kategorien:

  - name: Ameland
    fragen:
      - punkte: 10
        frage: Wie viele Ringe hat der Leuchtturm von Ameland?
        antwort: 10 Ringe
      - punkte: 20
        frage: Wie viele Monde sind auf der Flagge von Ameland?
        antwort: "2"
      - punkte: 30
        frage: |-
          Wie viele Klöße gab es dieses Jahr im großen Lager?
          (+/- 2)
        antwort: "99"
      - punkte: 40
        frage: Wie lautet der Name des kleinsten Ortes bzw. kleinsten Dorfes (nach Einwohnern) auf Ameland?
        antwort: |-
          Ballum
          (Mit ca. 370 Einwohnern ist Ballum der kleinste Ort.)
      - punkte: 50
        frage: Mit welchen „Hilfsmitteln“ wird das historische Rettungsboot zu Wasser gelassen?
        antwort: Mit Pferden
      - punkte: 60
        frage: |-
          Wie viele Kilometer Luftlinie ist Ameland vom Anleger entfernt?
          (+/- 1 km)
        antwort: 12,86 km
      - punkte: 70
        frage: |-
          Wie viele Einwohner hat Ameland?
          (+/- 50)
        antwort: |-
          3.807 Einwohner
          (Stand 01.01.2025)
      - punkte: 80
        frage: |-
          Wie alt sind alle Betreuer inkl. Küche zusammen?
          (+/- ein Jahr)
        antwort: |-
          204 Jahre
          Julius 32, Sina 30, David 24, Eric 24, Laura 24, Luisa 23, Marie 23, Lars 22, Joshua 2
      - punkte: 90
        typ: risiko
        frage: |-
          Wie viele Personen und wie viele PKW passen auf die Sier?
          (+/- 10 %)
        antwort: 1.200 Personen & 72 PKW
      - punkte: 100
        frage: Seit wann gibt es das große Lager?
        antwort: "1992"

